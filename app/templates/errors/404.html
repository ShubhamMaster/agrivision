{% extends "base.html" %}
{% block title %}{{ t("Page not found") }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-success">404</div>
  <h3 class="mt-2">{{ t("Page not found") }}</h3>

{% endblock %}
